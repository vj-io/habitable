  <path d="M964,698 C990,702 1020,698 1050,700" fill="none" stroke="#7a6e5a" stroke-width="12" stroke-linecap="round" opacity=".35"/>
  <path class="o" fill="#261c14" stroke-width="3.5" d="M826,700 L822,660 L836,640 L832,622 L852,608 L850,596 L878,586 L892,592 L912,584 L930,600 L950,608 L944,630 L962,646 L956,670 L964,700 Z"/>
