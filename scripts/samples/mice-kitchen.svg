    <path class="t" stroke="#f6ead0" d="M234,780 l-10,-6 M258,762 l-8,-10 M276,774 l-4,-14 M252,790 l-14,4"/>
    <path class="o" fill="#d9b24f" stroke-width="2.5" d="M290,810 L300,826 L316,812 Z"/>
  </g>
  <!-- spilled cereal -->
  <use href="#ring" x="304" y="826"/><use href="#ring" x="330" y="842"/><use href="#ring" x="352" y="822"/>
  <use href="#ring" x="378" y="846"/><use href="#ring" x="402" y="828"/><use href="#ring" x="426" y="850"/>
  <use href="#ring" x="446" y="832"/><use href="#ring" x="476" y="856"/><use href="#ring" x="318" y="862"/>
  <use href="#ring" x="368" y="872"/><use href="#ring" x="410" y="874"/>
  <path class="o" fill="#d9b24f" stroke-width="2.5" d="M270,850 l16,-8 l8,12 l-14,10 Z M440,868 l12,-6 l6,10 l-12,6 Z"/>

  <!-- droppings -->
  <g fill="#2b2118" stroke="#1a1a1a" stroke-width="2">
    <use href="#pellet" x="700" y="712" transform="rotate(20 700 712)"/><use href="#pellet" x="738" y="724" transform="rotate(-30 738 724)"/>
    <use href="#pellet" x="770" y="708" transform="rotate(50 770 708)"/><use href="#pellet" x="800" y="722" transform="rotate(5 800 722)"/>
    <use href="#pellet" x="655" y="710" transform="rotate(-10 655 710)"/><use href="#pellet" x="690" y="732" transform="rotate(35 690 732)"/>
    <use href="#pellet" x="810" y="740" transform="rotate(-45 810 740)"/><use href="#pellet" x="846" y="724" transform="rotate(15 846 724)"/>
    <use href="#pellet" x="880" y="736" transform="rotate(-20 880 736)"/><use href="#pellet" x="920" y="718" transform="rotate(60 920 718)"/>
    <use href="#pellet" x="948" y="738" transform="rotate(0 948 738)"/><use href="#pellet" x="540" y="716" transform="rotate(25 540 716)"/>
    <use href="#pellet" x="500" y="738" transform="rotate(-35 500 738)"/><use href="#pellet" x="610" y="726" transform="rotate(10 610 726)"/>
    <use href="#pellet" x="1000" y="722" transform="rotate(-15 1000 722)"/><use href="#pellet" x="1040" y="740" transform="rotate(40 1040 740)"/>
  </g>

  <!-- mouse, facing the spilled cereal; tail trails toward the hole -->
  <g transform="translate(640,800) scale(1.3)">
    <path d="M82,12 C130,6 150,52 196,40 C222,34 236,52 262,46" fill="none" stroke="#1a1a1a" stroke-width="9" stroke-linecap="round"/>
    <path d="M82,12 C130,6 150,52 196,40 C222,34 236,52 262,46" fill="none" stroke="#d9a9a0" stroke-width="4" stroke-linecap="round"/>
