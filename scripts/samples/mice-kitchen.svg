    <path fill="#cbbfb0" d="M-68,28 C-40,36 40,38 68,32 C58,24 -44,22 -68,28 Z"/>
    <path class="t" opacity=".6" d="M10,-30 l6,8 M30,-34 l6,8 M50,-28 l6,8 M20,-10 l6,8 M44,-8 l6,8 M62,0 l5,8"/>
