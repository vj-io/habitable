    <circle cx="-48" cy="-6" r="6" fill="#1a1a1a"/><circle cx="-50" cy="-8" r="2" fill="#fff"/>
    <circle class="o" cx="-80" cy="18" r="6" fill="#d98e8e" stroke-width="2.5"/>
    <path class="t" d="M-72,8 L-122,-8 M-72,14 L-126,12 M-72,20 L-120,34"/>
    <ellipse class="o" cx="-44" cy="38" rx="11" ry="6" fill="#d9a9a0" stroke-width="3"/>
    <ellipse class="o" cx="42" cy="40" rx="16" ry="7" fill="#d9a9a0" stroke-width="3"/>
  </g>
</g>
<rect width="1200" height="900" filter="url(#grain)" opacity=".5"/>
<rect width="1200" height="900" fill="url(#vig)"/>
</svg>
