    <circle cx="226" cy="676" r="9" fill="#c8863a" stroke="#1a1a1a" stroke-width="2.5"/><circle cx="188" cy="692" r="9" fill="#c8863a" stroke="#1a1a1a" stroke-width="2.5"/>
