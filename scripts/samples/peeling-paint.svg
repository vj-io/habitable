<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
<defs>
  <filter id="wob" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.018 0.02" numOctaves="2" seed="4" result="a"/>
    <feDisplacementMap in="SourceGraphic" in2="a" scale="12" xChannelSelector="R" yChannelSelector="G" result="b"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.07" numOctaves="1" seed="9" result="c"/>
    <feDisplacementMap in="b" in2="c" scale="3.5" xChannelSelector="G" yChannelSelector="B"/>
  </filter>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="2" seed="3"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.25  0 0 0 0 0.2  0 0 0 0 0.12  0 0 0 0.9 -0.35"/>
  </filter>
  <radialGradient id="vig" cx="50%" cy="50%" r="75%">
    <stop offset="0.55" stop-color="#46321c" stop-opacity="0"/>
    <stop offset="1" stop-color="#46321c" stop-opacity="0.28"/>
  </radialGradient>
  <!-- four different irregular blobs, offset so older coats show through unevenly (non-scaling stroke keeps the ink even) -->
  <path id="b1" vector-effect="non-scaling-stroke" d="M-150,-12 L-138,-34 L-118,-30 L-100,-48 L-70,-42 L-48,-58 L-14,-46 L14,-56 L44,-44 L70,-58 L104,-44 L124,-52 L146,-30 L136,-10 L152,6 L130,26 L138,42 L104,44 L82,58 L54,44 L24,56 L-6,44 L-34,58 L-62,44 L-92,52 L-112,38 L-138,40 L-130,20 Z"/>
  <path id="b2" vector-effect="non-scaling-stroke" d="M-104,-6 L-90,-26 L-64,-22 L-44,-36 L-14,-26 L16,-38 L44,-26 L70,-34 L96,-16 L88,2 L106,14 L82,28 L56,22 L34,36 L6,26 L-22,38 L-48,26 L-78,34 L-96,20 L-110,10 Z"/>
  <path id="b3" vector-effect="non-scaling-stroke" d="M-62,-4 L-46,-18 L-22,-12 L2,-22 L28,-12 L54,-16 L68,0 L56,12 L30,10 L6,22 L-20,12 L-46,20 L-64,10 Z"/>
  <path id="b4" vector-effect="non-scaling-stroke" d="M-26,-2 L-10,-12 L14,-8 L34,-14 L44,0 L30,10 L6,6 L-14,14 L-30,6 Z"/>
  <g id="patch" stroke="#1a1a1a" stroke-width="3.5" stroke-linejoin="round">
    <use href="#b1" fill="#a9bf9d"/>
    <use href="#b2" transform="translate(12,9)" fill="#a2bac6"/>
    <use href="#b3" transform="translate(24,13) scale(1.25,1.2)" fill="#8b7355"/>
  </g>
  <!-- a peeled strip: lies flat, lifts, curls back on itself; cream top coat, older green coat on its underside -->
  <g id="curl" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="70" cy="22" rx="100" ry="13" fill="#3a2a14" stroke="none" opacity=".22"/>
    <path d="M0,0 C60,0 112,-8 148,-42 C174,-66 168,-104 134,-104 C110,-104 104,-76 126,-74" stroke="#1a1a1a" stroke-width="31"/>
    <path d="M0,0 C60,0 112,-8 148,-42 C174,-66 168,-104 134,-104 C110,-104 104,-76 126,-74" stroke="#a9bf9d" stroke-width="24" transform="translate(2,5)"/>
    <path d="M0,0 C60,0 112,-8 148,-42 C174,-66 168,-104 134,-104 C110,-104 104,-76 126,-74" stroke="#ece4cf" stroke-width="18"/>
  </g>
  <path id="f1" d="M0,0 L26,-6 L40,6 L30,18 L10,22 L-2,12 Z"/>
  <path id="f2" d="M0,0 C14,-10 34,-12 54,-4 C42,2 24,8 6,6 Z"/>
  <path id="f3" d="M0,0 L14,-12 L30,-8 L34,8 L18,16 L4,12 Z"/>
</defs>
<style>
  .k{fill:none;stroke:#1a1a1a;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
  .t{fill:none;stroke:#1a1a1a;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
  .o{stroke:#1a1a1a;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
  .f{stroke:#1a1a1a;stroke-width:2.5;stroke-linejoin:round}
</style>
<g filter="url(#wob)">
  <!-- window frame (painted wood), glass, rail -->
  <rect x="-40" y="-40" width="1280" height="860" fill="#ece4cf"/>
  <rect class="o" x="210" y="70" width="780" height="380" fill="#d6e2e5"/>
  <path d="M300,70 L420,70 L270,450 L210,450 L210,330 Z M640,70 L700,70 L550,450 L490,450 Z" fill="#ffffff" opacity=".35"/>
  <path class="o" fill="#ece4cf" d="M592,70 H622 V450 H592 Z M210,240 H990 V266 H210 Z"/>
  <path class="o" fill="#ece4cf" d="M210,450 H990 V570 H210 Z"/>
  <path class="t" opacity=".45" d="M250,60 V450 M960,60 V450"/>
  <!-- sill top, nose, shadow, wall, floor -->
  <path class="o" fill="#e4dbc3" d="M130,570 H1070 L1160,662 H40 Z"/>
  <path class="o" fill="#ece4cf" d="M40,662 H1160 V716 H40 Z"/>
  <path class="o" fill="#bfb7a2" d="M40,716 H1160 V740 H40 Z"/>
  <path class="o" fill="#d8d0bc" d="M-40,740 H1240 V800 H-40 Z"/>
  <path class="t" opacity=".35" d="M120,760 l26,12 M500,770 l26,12 M900,760 l26,12"/>
  <rect class="o" x="-40" y="800" width="1280" height="160" fill="#9d7b4f"/>
  <path class="t" opacity=".7" d="M-40,845 H1240 M-40,890 H1240 M200,800 V845 M620,800 V845 M1000,800 V845 M80,845 V890 M400,845 V890 M820,845 V890 M1120,845 V890"/>

  <!-- peeled patches exposing older coats -->
  <use href="#patch" transform="translate(430,510) scale(.98,.82)"/>
  <use href="#patch" transform="translate(805,514) scale(.95,.74)"/>
  <use href="#patch" transform="translate(545,618) scale(1.55,.8)"/>
  <use href="#patch" transform="translate(105,255) rotate(90) scale(1,1.2)"/>
  <use href="#patch" transform="translate(1100,230) rotate(90) scale(.85,.95)"/>
  <use href="#patch" transform="translate(180,690) scale(.45,.28)"/>
  <use href="#patch" transform="translate(1000,690) scale(.4,.26)"/>
  <!-- peeled strips curling off the patches -->
  <use href="#curl" transform="translate(770,632) rotate(-4) scale(1.35)"/>
  <use href="#curl" transform="translate(330,632) scale(-1.4,1.4) rotate(3)"/>
  <use href="#curl" transform="translate(480,598) rotate(-6) scale(1.45)"/>
  <use href="#curl" transform="translate(404,472) rotate(-90) scale(.95)"/>
  <use href="#curl" transform="translate(870,476) rotate(-80) scale(.85)"/>
  <use href="#curl" transform="translate(150,330) rotate(10) scale(.6)"/>
  <use href="#curl" transform="translate(1056,310) scale(-.6,.6) rotate(-6)"/>
  <!-- flakes on the sill -->
  <g class="f">
    <use href="#f3" transform="translate(451,607) rotate(37) scale(1.19)" fill="#a9bf9d"/>
    <use href="#f1" transform="translate(216,634) rotate(109) scale(0.72)" fill="#a2bac6"/>
    <use href="#f1" transform="translate(564,641) rotate(282) scale(0.95)" fill="#ece4cf"/>
    <use href="#f2" transform="translate(966,603) rotate(298) scale(1.27)" fill="#a9bf9d"/>
    <use href="#f1" transform="translate(710,638) rotate(23) scale(1.03)" fill="#a2bac6"/>
    <use href="#f3" transform="translate(256,625) rotate(60) scale(1.04)" fill="#ece4cf"/>
    <use href="#f1" transform="translate(693,611) rotate(327) scale(0.81)" fill="#a9bf9d"/>
    <use href="#f1" transform="translate(219,596) rotate(254) scale(1.11)" fill="#a9bf9d"/>
    <use href="#f3" transform="translate(557,628) rotate(232) scale(0.92)" fill="#a9bf9d"/>
    <use href="#f2" transform="translate(374,611) rotate(153) scale(1.02)" fill="#ece4cf"/>
    <use href="#f3" transform="translate(1016,631) rotate(37) scale(0.77)" fill="#ece4cf"/>
    <use href="#f2" transform="translate(548,609) rotate(250) scale(0.95)" fill="#ece4cf"/>
    <use href="#f2" transform="translate(804,597) rotate(179) scale(1.06)" fill="#ece4cf"/>
    <use href="#f1" transform="translate(713,646) rotate(138) scale(0.98)" fill="#d3a8a3"/>
  </g>
  <!-- flakes on the floor -->
  <g class="f">
    <use href="#f2" transform="translate(193,819) rotate(348) scale(1.54)" fill="#a9bf9d"/>
    <use href="#f2" transform="translate(642,861) rotate(236) scale(1.12)" fill="#ece4cf"/>
    <use href="#f1" transform="translate(299,875) rotate(147) scale(0.92)" fill="#ece4cf"/>
    <use href="#f3" transform="translate(567,862) rotate(254) scale(0.87)" fill="#a2bac6"/>
    <use href="#f2" transform="translate(979,863) rotate(220) scale(1.58)" fill="#d3a8a3"/>
    <use href="#f2" transform="translate(630,865) rotate(194) scale(1.66)" fill="#a9bf9d"/>
    <use href="#f2" transform="translate(369,822) rotate(337) scale(1.01)" fill="#ece4cf"/>
    <use href="#f2" transform="translate(1053,887) rotate(2) scale(0.93)" fill="#ece4cf"/>
    <use href="#f2" transform="translate(816,890) rotate(353) scale(1.57)" fill="#a2bac6"/>
    <use href="#f3" transform="translate(170,870) rotate(201) scale(0.89)" fill="#ece4cf"/>
    <use href="#f2" transform="translate(880,819) rotate(106) scale(1.20)" fill="#ece4cf"/>
    <use href="#f1" transform="translate(285,855) rotate(290) scale(0.94)" fill="#ece4cf"/>
    <use href="#f1" transform="translate(267,858) rotate(106) scale(1.35)" fill="#ece4cf"/>
    <use href="#f2" transform="translate(364,844) rotate(242) scale(0.91)" fill="#a9bf9d"/>
    <use href="#f3" transform="translate(1059,871) rotate(43) scale(0.93)" fill="#ece4cf"/>
    <use href="#f3" transform="translate(761,845) rotate(82) scale(1.26)" fill="#d3a8a3"/>
    <use href="#f2" transform="translate(480,879) rotate(278) scale(1.62)" fill="#ece4cf"/>
    <use href="#f2" transform="translate(670,823) rotate(85) scale(1.12)" fill="#ece4cf"/>
    <use href="#f2" transform="translate(516,880) rotate(313) scale(1.53)" fill="#a9bf9d"/>
    <use href="#f3" transform="translate(459,842) rotate(116) scale(0.98)" fill="#a9bf9d"/>
    <use href="#f1" transform="translate(1069,857) rotate(143) scale(1.23)" fill="#a2bac6"/>
    <use href="#f2" transform="translate(456,889) rotate(178) scale(1.66)" fill="#ece4cf"/>
    <use href="#f2" transform="translate(806,822) rotate(240) scale(0.98)" fill="#ece4cf"/>
    <use href="#f1" transform="translate(478,873) rotate(334) scale(1.11)" fill="#ece4cf"/>
    <use href="#f3" transform="translate(233,827) rotate(102) scale(1.23)" fill="#a9bf9d"/>
    <use href="#f2" transform="translate(425,867) rotate(202) scale(1.22)" fill="#ece4cf"/>
    <use href="#f2" transform="translate(233,832) rotate(14) scale(0.94)" fill="#a2bac6"/>
    <use href="#f3" transform="translate(1013,830) rotate(179) scale(0.94)" fill="#a9bf9d"/>
    <use href="#f1" transform="translate(328,814) rotate(332) scale(0.89)" fill="#a9bf9d"/>
    <use href="#f2" transform="translate(345,867) rotate(108) scale(0.83)" fill="#d3a8a3"/>
  </g>
  <!-- small peeling bits on the wall below the sill -->
  <g class="f">
    <use href="#f2" transform="translate(300,748) rotate(10) scale(1.3)" fill="#d8d0bc"/>
    <use href="#f1" transform="translate(700,752) rotate(170) scale(1.0)" fill="#ece4cf"/>
  </g>
</g>
<rect width="1200" height="900" filter="url(#grain)" opacity=".5"/>
<rect width="1200" height="900" fill="url(#vig)"/>
</svg>
